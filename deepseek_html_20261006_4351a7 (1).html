<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мэмо: Внутренние устройства компьютера</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(ellipse at top, #1e3a5f 0%, #0a1929 60%, #050a14 100%);
    min-height: 100vh;
    padding: 20px;
    color: #e8eef5;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #4fc3f7, #81d4fa, #29b6f6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: 1px;
  }

  .subtitle {
    text-align: center;
    font-size: 0.95rem;
    color: #78909c;
    margin-bottom: 20px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .stat {
    background: linear-gradient(145deg, rgba(79, 195, 247, 0.1), rgba(41, 182, 246, 0.05));
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 0.95rem;
    border: 1px solid rgba(79, 195, 247, 0.3);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  }

  .stat span { color: #4fc3f7; font-weight: bold; font-size: 1.1rem; }

  .board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 1000px) { .board { grid-template-columns: repeat(5, 1fr); gap: 10px; } }
  @media (max-width: 750px) {
    .board { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    h1 { font-size: 1.4rem; }
    .stat { padding: 6px 14px; font-size: 0.8rem; }
  }
  @media (max-width: 500px) {
    .board { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    h1 { font-size: 1.1rem; }
  }

  /* ====== Обёртка карточки (держит место в сетке, НЕ анимируется) ====== */
  .card {
    aspect-ratio: 3 / 4;
    perspective: 1200px;
    cursor: pointer;
    position: relative;
  }

  .card:not(.matched):not(.flipped):hover {
    transform: translateY(-4px);
    transition: transform 0.2s;
  }

  /* ====== Внутренний контейнер (отвечает за 3D-переворот и улёт) ====== */
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(0.4, 0.0, 0.2, 1);
    transform-style: preserve-3d;
    transform-origin: center center;
  }

  .card.flipped .card-inner { transform: rotateY(180deg); }

  .card-front, .card-back {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    text-align: center;
    overflow: hidden;
  }

  /* Рубашка */
  .card-front {
    background:
      radial-gradient(circle at 50% 50%, rgba(79, 195, 247, 0.15) 0%, transparent 60%),
      linear-gradient(145deg, #0f3460 0%, #1a1a2e 100%);
    border: 2px solid rgba(79, 195, 247, 0.5);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), inset 0 0 30px rgba(79, 195, 247, 0.1);
  }

  .card-front::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px dashed rgba(79, 195, 247, 0.3);
    border-radius: 8px;
  }

  .card-front::after {
    content: "?";
    font-size: 2.2rem;
    font-weight: bold;
    background: linear-gradient(135deg, #4fc3f7, #81d4fa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(79, 195, 247, 0.8);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.1); }
  }

  /* Лицевая сторона */
  .card-back {
    background: #ffffff;
    transform: rotateY(180deg);
    border: 2px solid #4fc3f7;
    color: #0d47a1;
    box-shadow: 0 6px 20px rgba(79, 195, 247, 0.3);
  }

  .card-back img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 4px;
    background: #ffffff;
    border-radius: 10px;
  }

  .card-back.text-card {
    font-size: 0.9rem;
    font-weight: 700;
    padding: 10px 8px;
    line-height: 1.25;
    word-break: break-word;
    color: #0d47a1;
    background: linear-gradient(145deg, #ffffff, #bbdefb);
    letter-spacing: 0.3px;
  }

  @media (max-width: 750px) { .card-back.text-card { font-size: 0.72rem; padding: 6px 4px; } }
  @media (max-width: 500px) { .card-back.text-card { font-size: 0.62rem; } }

  /* ====== УЛЁТ: анимируем ТОЛЬКО .card-inner ====== */
  .card.matched { pointer-events: none; }

  .card.matched .card-inner {
    animation: flyAway 1.1s cubic-bezier(0.5, 0.0, 0.75, 0) forwards;
  }

  @keyframes flyAway {
    0% {
      transform: rotateY(180deg) translateY(0) scale(1);
      opacity: 1;
      filter: brightness(1);
    }
    25% {
      transform: rotateY(180deg) translateY(-20px) scale(1.12);
      opacity: 1;
      filter: brightness(1.6) drop-shadow(0 0 25px #4fc3f7);
    }
    60% {
      transform: rotateY(180deg) translateY(-200px) scale(0.75);
      opacity: 0.7;
      filter: brightness(1.9) drop-shadow(0 0 40px #4fc3f7);
    }
    100% {
      transform: rotateY(180deg) translateY(-550px) scale(0.25);
      opacity: 0;
      filter: brightness(2.2) drop-shadow(0 0 60px #4fc3f7);
    }
  }

  /* Тряска при ошибке */
  .card.wrong .card-inner { animation: shake 0.55s; }

  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    20%      { transform: rotateY(180deg) translateX(-8px); }
    40%      { transform: rotateY(180deg) translateX(8px); }
    60%      { transform: rotateY(180deg) translateX(-6px); }
    80%      { transform: rotateY(180deg) translateX(6px); }
  }

  /* ====== Модальное окно с информацией ====== */
  .info-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 10, 20, 0.92);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 90;
    animation: fadeIn 0.3s;
    padding: 20px;
  }

  .info-overlay.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .info-box {
    background: linear-gradient(145deg, #1a2942, #0f1e33);
    border: 2px solid #4fc3f7;
    border-radius: 24px;
    padding: 32px;
    text-align: center;
    max-width: 540px;
    width: 100%;
    box-shadow: 0 0 80px rgba(79, 195, 247, 0.5);
    animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes popIn {
    0%   { transform: scale(0.5) translateY(50px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .info-box .photo-wrap {
    width: 200px;
    height: 200px;
    margin: 0 auto 20px;
    background: #ffffff;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    box-shadow: 0 0 40px rgba(79, 195, 247, 0.4);
    border: 2px solid rgba(79, 195, 247, 0.6);
  }

  .info-box .photo-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .info-box h2 {
    color: #4fc3f7;
    font-size: 1.7rem;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }

  .info-box p {
    margin-bottom: 22px;
    font-size: 1rem;
    color: #cfd8dc;
    line-height: 1.6;
    text-align: left;
  }

  .info-box button, .win-box button {
    background: linear-gradient(145deg, #4fc3f7, #0288d1);
    border: none;
    color: white;
    padding: 14px 36px;
    font-size: 1rem;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
    box-shadow: 0 6px 20px rgba(79, 195, 247, 0.4);
    letter-spacing: 0.5px;
  }

  .info-box button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .info-box button:not(:disabled):hover, .win-box button:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 10px 30px rgba(79, 195, 247, 0.7);
  }

  /* ====== Победа ====== */
  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 10, 20, 0.95);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: fadeIn 0.5s;
  }

  .win-overlay.show { display: flex; }

  .win-box {
    background: linear-gradient(145deg, #1a2942, #0f1e33);
    border: 2px solid #4fc3f7;
    border-radius: 24px;
    padding: 50px 40px;
    text-align: center;
    max-width: 460px;
    box-shadow: 0 0 100px rgba(79, 195, 247, 0.6);
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .win-box h2 {
    color: #4fc3f7;
    font-size: 2.4rem;
    margin-bottom: 18px;
    text-shadow: 0 0 30px rgba(79, 195, 247, 0.6);
  }

  .win-box p { margin-bottom: 26px; font-size: 1.1rem; color: #b0bec5; line-height: 1.6; }
  .win-box b { color: #81d4fa; }

  .controls { text-align: center; margin-top: 26px; }

  .controls button {
    background: rgba(79, 195, 247, 0.1);
    border: 1px solid #4fc3f7;
    color: #4fc3f7;
    padding: 12px 30px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.3s;
    font-weight: 600;
  }

  .controls button:hover {
    background: rgba(79, 195, 247, 0.25);
    box-shadow: 0 0 20px rgba(79, 195, 247, 0.4);
  }
</style>
</head>
<body>

<h1>🖥️ Мэмо: Внутренние устройства компьютера</h1>
<p class="subtitle">Найди пару «фото ↔ название» и узнай, зачем нужно это устройство</p>

<div class="stats">
  <div class="stat">Ходы: <span id="moves">0</span></div>
  <div class="stat">Найдено пар: <span id="pairs">0</span> / 15</div>
  <div class="stat">Время: <span id="timer">00:00</span></div>
</div>

<div class="board" id="board"></div>

<div class="controls">
  <button onclick="startGame()">🔄 Начать заново</button>
</div>

<div class="info-overlay" id="infoOverlay">
  <div class="info-box">
    <div class="photo-wrap">
      <img id="infoPhoto" src="" alt="">
    </div>
    <h2 id="infoName"></h2>
    <p id="infoDesc"></p>
    <button id="continueBtn" onclick="closeInfo()">Продолжить игру</button>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <h2>🎉 Победа!</h2>
    <p>Вы нашли все 15 пар за <b id="finalMoves">0</b> ходов и <b id="finalTime">00:00</b>.</p>
    <button onclick="startGame()">Играть снова</button>
  </div>
</div>

<script>
/* =========================================================
   15 УСТРОЙСТВ С РЕАЛИСТИЧНЫМИ ФОТО И ОПИСАНИЯМИ
   ========================================================= */

    desc: "Процессор — «мозг» компьютера. Он выполняет все вычисления и управляет работой других устройств. Чем выше тактовая частота и больше ядер, тем быстрее работает компьютер."
  },
  {

    photo: "images/motherboard.jpg",
    fallback: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="15" width="80" height="70" rx="3" fill="#1b5e20"/><rect x="20" y="25" width="20" height="20" fill="#263238"/><rect x="50" y="25" width="30" height="8" fill="#ffb300"/></svg>`,
    desc: "Материнская плата — «скелет» компьютера. К ней подключаются все остальные устройства: процессор, память, видеокарта, накопители. Она обеспечивает связь между ними."

  {

    photo: "images/ram.jpg",
    fallback: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="35" width="84" height="30" rx="3" fill="#2e7d32"/><rect x="15" y="40" width="10" height="20" fill="#1a1a1a"/><rect x="30" y="40" width="10" height="20" fill="#1a1a1a"/></svg>`,
    desc: "Оперативная память (ОЗУ) хранит данные, с которыми компьютер работает прямо сейчас. Чем её больше, тем больше программ можно открыть одновременно без тормозов."

    desc: "Жёсткий диск (HDD) — устройство долговременного хранения данных. На нём хранятся операционная система, программы, фото и документы. Внутри — вращающиеся магнитные пластины."

  },
  {

  {
    name: "Термопаста",
    photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Thermal_paste.jpg/500px-Thermal_paste.jpg",
    fallback: `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="20" width="40" height="60" rx="5" fill="#e0e0e0"/><rect x="35" y="30" width="30" height="25" fill="#4fc3f7"/><text x="50" y="46" text-anchor="middle" fill="#fff" font-size="7">PASTE</text></svg>`,
    desc: "Термопаста наносится между процессором и кулером. Она заполняет микроскопические неровности поверхностей и улучшает передачу тепла, чтобы процессор не перегревался."
  }
];
/* ================= ПРОВЕРКА НА ДУБЛИ ================= */
(function checkDuplicates() {
  const names = devices.map(d => d.name);
  const unique = new Set(names);
  if (names.length !== unique.size) {
    console.error("⚠️ В массиве devices есть дубликаты названий!");
  }
})();

/* ================= ЛОГИКА ИГРЫ ================= */
let flipped = [];
let matched = 0;
let moves = 0;
let lock = false;
let timerInterval = null;
let seconds = 0;
let started = false;
let continueTimeout = null;

const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const timerEl = document.getElementById('timer');
const winOverlay = document.getElementById('winOverlay');
const infoOverlay = document.getElementById('infoOverlay');
const infoPhoto = document.getElementById('infoPhoto');
const infoName = document.getElementById('infoName');
const infoDesc = document.getElementById('infoDesc');
const continueBtn = document.getElementById('continueBtn');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function startTimer() {
  if (started) return;
  started = true;
  timerInterval = setInterval(() => {
    seconds++;
    timerEl.textContent = formatTime(seconds);
  }, 1000);
}

function startGame() {
  clearInterval(timerInterval);
  clearTimeout(continueTimeout);
  flipped = [];
  matched = 0;
  moves = 0;
  seconds = 0;
  lock = false;
  started = false;

  movesEl.textContent = '0';
  pairsEl.textContent = '0';
  timerEl.textContent = '00:00';
  winOverlay.classList.remove('show');
  infoOverlay.classList.remove('show');
  infoOverlay.dataset.last = '';
  board.innerHTML = '';

  // Готовим колоду: 15 фото + 15 названий
  const deck = [];
  devices.forEach((dev, idx) => {
    deck.push({ id: idx, type: 'image', device: dev });
    deck.push({ id: idx, type: 'text', text: dev.name, device: dev });
  });

  const shuffled = shuffle(deck);

  shuffled.forEach((card) => {
    const el = document.createElement('div');
    el.className = 'card';

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const front = document.createElement('div');
    front.className = 'card-front';

    const back = document.createElement('div');
    back.className = 'card-back ' + (card.type === 'image' ? 'image-card' : 'text-card');

    if (card.type === 'image') {
      const img = document.createElement('img');
      img.alt = card.device.name;
      img.src = card.device.photo;
      img.loading = 'lazy';

      img.onerror = function () {
        this.remove();
        const wrap = document.createElement('div');
        wrap.innerHTML = card.device.fallback;
        wrap.style.width = '100%';
        wrap.style.height = '100%';
        wrap.style.display = 'flex';
        wrap.style.alignItems = 'center';
        wrap.style.justifyContent = 'center';
        back.appendChild(wrap);
      };

      back.appendChild(img);
    } else {
      back.textContent = card.text;
    }

    inner.appendChild(front);
    inner.appendChild(back);
    el.appendChild(inner);

    // Данные храним в замыкании через WeakMap — их не видно в DOM
    el._cardData = { id: card.id, type: card.type, device: card.device };

    el.addEventListener('click', () => onCardClick(el));
    board.appendChild(el);
  });
}

function onCardClick(el) {
  if (lock) return;
  if (el.classList.contains('matched')) return;
  if (el.classList.contains('flipped')) return;

  // Если уже открыта одна карточка и кликаем на третью (не на неё же) —
  // закрываем первую, новая становится «первой»
  if (flipped.length === 1 && flipped[0] !== el) {
    // Если первая ещё не закрыта — оставляем её как первую,
    // просто добавляем вторую
  }

  startTimer();
  el.classList.add('flipped');
  flipped.push(el);

  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const dataA = a._cardData;
  const dataB = b._cardData;
  const sameId = dataA.id === dataB.id;
  const diffType = dataA.type !== dataB.type;

  if (sameId && diffType) {
    // Совпадение
    lock = true;
    const device = dataA.device;

    setTimeout(() => {
      a.classList.add('matched');
      b.classList.add('matched');
      matched++;
      pairsEl.textContent = matched;
      flipped = [];

      // Показываем окно с информацией
      infoPhoto.src = device.photo;
      infoPhoto.alt = device.name;
      infoName.textContent = device.name;
      infoDesc.textContent = device.desc;

      // Блокируем кнопку «Продолжить» на 3 секунды
      continueBtn.disabled = true;
      continueBtn.textContent = 'Продолжить игру (3)';
      let countdown = 3;
      continueTimeout = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          continueBtn.textContent = `Продолжить игру (${countdown})`;
        } else {
          clearInterval(continueTimeout);
          continueBtn.disabled = false;
          continueBtn.textContent = 'Продолжить игру';
        }
      }, 1000);

      infoOverlay.classList.add('show');

      // Если это последняя пара — победа после закрытия окна
      if (matched === devices.length) {
        infoOverlay.dataset.last = "true";
      }
    }, 500);
  } else {
    // Не совпало — тряска и возврат рубашкой вверх
    lock = true;
    a.classList.add('wrong');
    b.classList.add('wrong');
    setTimeout(() => {
      a.classList.remove('flipped', 'wrong');
      b.classList.remove('flipped', 'wrong');
      flipped = [];
      lock = false;
    }, 1000);
  }
}

function closeInfo() {
  if (continueBtn.disabled) return; // защита от преждевременного закрытия
  infoOverlay.classList.remove('show');
  if (infoOverlay.dataset.last === "true") {
    infoOverlay.dataset.last = "";
    setTimeout(() => endGame(), 300);
  } else {
    lock = false;
  }
}

function endGame() {
  clearInterval(timerInterval);
  document.getElementById('finalMoves').textContent = moves;
  document.getElementById('finalTime').textContent = formatTime(seconds);
  winOverlay.classList.add('show');
}

startGame();
</script>
</body>
</html>
